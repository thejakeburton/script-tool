name: Build macOS application
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: pyinstaller --noconfirm --windowed --name ScriptTool --collect-all pymupdf main.py
      - run: ditto -c -k --sequesterRsrc --keepParent dist/ScriptTool.app ScriptTool-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ScriptTool-macOS
          path: ScriptTool-macOS.zip
